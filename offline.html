<!DOCTYPE html>
<html lang="mn" translate="no">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Офлайн — NGU</title>
<meta name="robots" content="noindex">

<style>
  @font-face{font-family:'Rubik';font-style:normal;font-display:swap;font-weight:300 900;src:url(/fonts/rubik-cyrillic-ext-wght-normal.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;}
  @font-face{font-family:'Rubik';font-style:normal;font-display:swap;font-weight:300 900;src:url(/fonts/rubik-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
  @font-face{font-family:'Rubik';font-style:normal;font-display:swap;font-weight:300 900;src:url(/fonts/rubik-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  :root{
    color-scheme:light only;
    --blue:#2B3AFF; --sun:#FFD43B; --navy:#0E1038; --white:#FFFFFF;
    --white-soft:rgba(255,255,255,.86);
    --line:2.5px; --lift-sm:4px 5px 0 var(--navy);
    --font:'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100vh;background:var(--blue);color:var(--white);font-family:var(--font);
    display:flex;flex-direction:column;justify-content:center;
    padding:32px 28px calc(48px + env(safe-area-inset-bottom));
  }
  main{max-width:640px;margin:0 auto;width:100%;}
  .mark{
    display:grid;place-items:center;width:56px;height:56px;margin-bottom:40px;
    background:var(--sun);color:var(--navy);border:var(--line) solid var(--navy);border-radius:18px;
    font-weight:900;font-size:1.1rem;letter-spacing:-.03em;transform:rotate(-5deg);
  }
  .code{font-weight:900;font-size:clamp(3.6rem,17vw,8rem);line-height:.9;letter-spacing:-.05em;}
  h1{margin:26px 0 0;font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.15;letter-spacing:-.02em;}
  p{margin:16px 0 0;max-width:44ch;color:var(--white-soft);line-height:1.55;}
  .actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:34px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--font);font-weight:600;font-size:1rem;line-height:1;text-decoration:none;
    padding:16px 26px;border-radius:999px;border:var(--line) solid var(--navy);
    background:var(--white);color:var(--navy);box-shadow:var(--lift-sm);cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--navy);}
  .btn:active{transform:translate(4px,5px);box-shadow:0 0 0 var(--navy);}
  .btn-sun{background:var(--sun);}
  #app{display:none;}
  .btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px;}
  @media (max-width:560px){ .actions .btn{flex:1 1 100%;} }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">NGU</div>
  <div class="code" aria-hidden="true">Офлайн</div>
  <h1>Та интернэтгүй байна</h1>
  <p>Энэ хуудас ачаалагдсангүй. Интернэтэд холбогдоод дахин оролдоно уу.</p>
  <div class="actions">
    <button type="button" class="btn btn-sun" id="reload">Дахин ачаалах</button>
    <a class="btn" id="app" href="/ngworship/">Дууны номыг нээх</a>
  </div>
</main>
<script>
  document.getElementById('reload').addEventListener('click', function () { location.reload(); });
  // The songbook app works without a connection, but only if it was opened
  // once on this device: offer it only then (its saved copy is in Cache Storage).
  try {
    caches.keys().then(function (keys) {
      if (keys.some(function (k) { return k.indexOf('songbook-') === 0; })) {
        document.getElementById('app').style.display = 'inline-flex';
      }
    }).catch(function () {});
  } catch (e) { /* no Cache Storage: the button stays hidden */ }
</script>
</body>
</html>
